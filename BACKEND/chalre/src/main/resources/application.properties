# ==========================================
# RATE LIMITING CONFIGURATION
# ==========================================
rate-limit.enabled=true
rate-limit.trust-proxy-headers=true

# Tier 1 — Auth
rate-limit.auth.login.capacity=5
rate-limit.auth.login.tokens-per-minute=5

rate-limit.auth.register.capacity=5
rate-limit.auth.register.tokens-per-minute=5

rate-limit.auth.social-login.capacity=10
rate-limit.auth.social-login.tokens-per-minute=10

# Tier 2 — Public / External API
rate-limit.public.location.capacity=30
rate-limit.public.location.tokens-per-minute=30

rate-limit.public.preview.capacity=10
rate-limit.public.preview.tokens-per-minute=10

rate-limit.public.search.capacity=60
rate-limit.public.search.tokens-per-minute=60

# Tier 3 — Authenticated User Actions
rate-limit.user.chat.capacity=30
rate-limit.user.chat.tokens-per-minute=30

rate-limit.user.ride-create.capacity=10
rate-limit.user.ride-create.tokens-per-minute=10

rate-limit.user.booking.capacity=10
rate-limit.user.booking.tokens-per-minute=10

rate-limit.user.payment.capacity=5
rate-limit.user.payment.tokens-per-minute=5

rate-limit.user.rating.capacity=10
rate-limit.user.rating.tokens-per-minute=10

# Global Fallback
rate-limit.global.capacity=300
rate-limit.global.tokens-per-minute=300

