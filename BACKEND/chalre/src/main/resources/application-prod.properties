spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.access-token.expiry-ms=${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
jwt.refresh-token.expiry-days=${JWT_REFRESH_TOKEN_EXPIRY_DAYS:30}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

file.upload-dir=/tmp/uploads

ors.api.key=${ORS_API_KEY}

google.places.api.key=${GOOGLE_PLACES_API_KEY}
LOCATIONIQ_API_KEY=${LOCATIONIQ_API_KEY}

# HikariCP Connection Pool - Reconnection Settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ==========================================
# CORS CONFIGURATION (Strict finite allowlist)
# ==========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://chalre-staging.vercel.app,https://staging.chalre.in,https://chalre.in,https://chalre.vercel.app,http://localhost:5173,http://localhost:3000}
