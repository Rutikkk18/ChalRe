spring.datasource.url=jdbc:h2:mem:chalre_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=TEST_JWT_SECRET_KEY_FOR_LOCAL_UNIT_TESTING_1234567890
jwt.access-token.expiry-ms=900000
jwt.refresh-token.expiry-days=30

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

file.upload-dir=target/test-uploads

# Cloudinary (TEST)
cloudinary.cloud-name=demo
cloudinary.api-key=demo
cloudinary.api-secret=demo

FIREBASE_SERVICE_ACCOUNT=
ors.api.key=test_ors_key
LOCATIONIQ_API_KEY=

# Rate limiting
rate-limit.enabled=false
